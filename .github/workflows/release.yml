name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository != 'mihonapp/mihon'
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A release signed with another key can't update the installed one, so users would lose their data.
      - name: Decode signing keystore
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is missing: refusing to sign the release with a throwaway key."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
          {
            echo "MIHON_GITHUB_RELEASE=true"
            echo "storeFile=${{ runner.temp }}/release.keystore"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # No -Pdist: keeps telemetry and the upstream updater out of the fork's builds.
      - name: Build
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          set -e

          tag="${GITHUB_REF#refs/tags/}"
          mv app/build/outputs/apk/release/app-universal-release.apk "mihon-$tag.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "mihon-arm64-v8a-$tag.apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihon
          path: mihon-*.apk

  release:
    if: github.repository != 'mihonapp/mihon'
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mihon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: mihon-*.apk
          generate_release_notes: true
